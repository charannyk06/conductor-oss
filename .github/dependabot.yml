version: 2

updates:
  # Root Bun workspace
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      compatible-minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  # Preview worker has an independent Bun lock for its Docker build.
  - package-ecosystem: bun
    directory: /preview-worker
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      compatible-minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  # Rust / Cargo
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      compatible-minor-and-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  # Go bridge
  - package-ecosystem: gomod
    directory: /bridge-cmd
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Strix scanner requirements used by CI
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # These releases require vulnerable cryptography<49. Re-evaluate a future fixed release.
      - dependency-name: strix-agent
        versions:
          - ">=1.4.0, <=1.5.2"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
