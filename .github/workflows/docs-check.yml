# Verify docs/manifest.json stays in sync with actual source files on every PR.

name: Docs Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate docs/manifest.json
        run: bash scripts/validate-docs.sh
