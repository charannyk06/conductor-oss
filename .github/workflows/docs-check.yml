# Verify docs/manifest.json stays in sync with actual source files on every PR.

name: Docs Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate docs/manifest.json
        run: bash scripts/validate-docs.sh
