# Verify docs/manifest.json stays in sync with actual source files on every PR.

name: Docs Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Validate docs/manifest.json
        run: bash scripts/validate-docs.sh
