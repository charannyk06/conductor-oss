name: Hosted Surfaces

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-surfaces
  cancel-in-progress: true

jobs:
  production-contract:
    name: Production contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify hosted dashboard and relay alignment
        run: bash scripts/check-hosted-surfaces.sh
