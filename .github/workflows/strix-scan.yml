name: strix-security-scan

on:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Scan depth"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - standard
          - deep
      target_url:
        description: "Dashboard URL to scan"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  STRIX_LLM: ${{ secrets.STRIX_LLM }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  STRIX_TELEMETRY: "false"

jobs:
  preflight:
    name: Strix availability
    runs-on: ubuntu-latest
    outputs:
      run_scan: ${{ steps.config.outputs.run_scan }}
      scan_mode: ${{ steps.config.outputs.scan_mode }}
      target_url: ${{ steps.config.outputs.target_url }}
    steps:
      - name: Check scanner configuration
        id: config
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          INPUT_SCAN_MODE: ${{ github.event.inputs.scan_mode }}
          INPUT_TARGET_URL: ${{ github.event.inputs.target_url }}
        shell: bash
        run: |
          set -euo pipefail
          scan_mode="${INPUT_SCAN_MODE:-quick}"
          case "$scan_mode" in
            quick|standard|deep) ;;
            *)
              echo "::error::Invalid scan_mode '$scan_mode'. Expected quick, standard, or deep."
              exit 1
              ;;
          esac
          printf 'scan_mode=%s\n' "$scan_mode" >> "$GITHUB_OUTPUT"

          target_url="${INPUT_TARGET_URL:-}"
          if [ -n "$target_url" ]; then
            case "$target_url" in
              *$'\r'*|*$'\n'*)
                echo "::error::target_url must be a single line when provided."
                exit 1
                ;;
              http://*|https://*) ;;
              *)
                echo "::error::target_url must start with http:// or https:// when provided."
                exit 1
                ;;
            esac
          fi
          printf 'target_url=%s\n' "$target_url" >> "$GITHUB_OUTPUT"

          if [ -z "${STRIX_LLM:-}" ]; then
            printf 'run_scan=%s\n' "false" >> "$GITHUB_OUTPUT"
            echo "::error::STRIX_LLM is required; refusing to report a successful security workflow without a scan."
            exit 1
          fi

          if [ -z "${LLM_API_KEY:-}" ]; then
            printf 'run_scan=%s\n' "false" >> "$GITHUB_OUTPUT"
            echo "::error::LLM_API_KEY is required for the configured Strix model; refusing to start the scan."
            exit 1
          fi

          printf 'run_scan=%s\n' "true" >> "$GITHUB_OUTPUT"

  security-scan:
    name: Strix security scan
    needs: preflight
    if: needs.preflight.outputs.run_scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/requirements/strix-security-scan.txt

      - name: Install Strix
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/strix-security-scan.txt

      - name: Run configured scan
        id: scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TARGET_URL: ${{ needs.preflight.outputs.target_url }}
          SCAN_MODE: ${{ needs.preflight.outputs.scan_mode }}
        run: |
          set -uo pipefail
          status=0
          if [ -n "$TARGET_URL" ]; then
            strix -n \
              --target "$TARGET_URL" \
              --target ./ \
              --scan-mode "$SCAN_MODE" \
              --instruction-file ./strix-instructions.md || status=$?
          else
            strix -n \
              --target ./ \
              --scan-mode "$SCAN_MODE" \
              --instruction-file ./strix-instructions.md || status=$?
          fi

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0|2) ;;
            *)
              echo "::error::Strix failed before it produced an enforceable result (exit $status)."
              exit "$status"
              ;;
          esac

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strix-results
          path: strix_runs/
          retention-days: 30

      - name: Enforce high and critical findings
        env:
          STRIX_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          valid_json=0
          blocking=0
          while IFS= read -r -d '' report; do
            if ! jq -e . "$report" >/dev/null 2>&1; then
              continue
            fi
            valid_json=1
            if jq -e '
              .. | objects | .severity? | strings | ascii_downcase
              | select(. == "critical" or . == "high")
            ' "$report" >/dev/null; then
              echo "::error::High or critical security findings detected in $report."
              blocking=1
            fi
          done < <(find strix_runs -type f -name "*.json" -print0 2>/dev/null || true)

          if [ "$blocking" -eq 1 ]; then
            exit 1
          fi
          if [ "$STRIX_EXIT_CODE" = "2" ] && [ "$valid_json" -ne 1 ]; then
            echo "::error::Strix reported findings, but no valid JSON report was available to enforce severity."
            exit 1
          fi
