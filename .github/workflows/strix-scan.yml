name: strix-security-scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Scan depth"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - standard
          - deep
      target_url:
        description: "Dashboard URL to scan"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  STRIX_LLM: ${{ secrets.STRIX_LLM }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Decide whether Strix scan can run
        id: preflight
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -z "$STRIX_LLM" ]; then
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STRIX_LLM is not configured; skipping security scan for pull_request runs."
          else
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.preflight.outputs.run_scan == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Strix
        if: steps.preflight.outputs.run_scan == 'true'
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/strix-security-scan.txt

      - name: Run quick scan (PR gate)
        if: github.event_name == 'pull_request' && steps.preflight.outputs.run_scan == 'true'
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix -n \
            --target ./ \
            --scan-mode quick \
            --instruction-file ./strix-instructions.md

      - name: Run configured scan (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
          SCAN_MODE: ${{ github.event.inputs.scan_mode }}
        run: |
          if [ -z "$STRIX_LLM" ]; then
            echo "::error::STRIX_LLM is required for manual scan runs."
            exit 1
          fi

          if [ -n "$TARGET_URL" ]; then
            strix -n \
              --target "$TARGET_URL" \
              --target ./ \
              --scan-mode "$SCAN_MODE" \
              --instruction-file ./strix-instructions.md
          else
            strix -n \
              --target ./ \
              --scan-mode "$SCAN_MODE" \
              --instruction-file ./strix-instructions.md
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strix-results
          path: strix_runs/
          retention-days: 30

      - name: Check for critical findings
        if: github.event_name == 'pull_request'
        run: |
          if find strix_runs -name "*.json" -exec grep -l '"severity":"critical"' {} + 2>/dev/null; then
            echo "::error::Critical security findings detected. Review strix_runs/ output."
            exit 1
          fi
          if find strix_runs -name "*.json" -exec grep -l '"severity":"high"' {} + 2>/dev/null; then
            echo "::warning::High-severity findings detected. Review strix_runs/ output."
          fi
